name: Stream URL Yenile

on:
  schedule:
    - cron: "19 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: streams
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıklar
        run: pip3 install -r requirements.txt

      - name: Playwright tarayıcı
        run: python3 -m playwright install chromium

      - name: Inat TV domain guncelle
        continue-on-error: true
        run: python3 src/inat_discover.py

      - name: Puhu TV stream güncelle
        run: python3 src/refresh_puhu.py

      - name: ercdn/mncdn stream güncelle
        run: python3 src/refresh_ercdn.py

      - name: tvkulesi stream güncelle
        run: python3 src/refresh_tvku.py

      - name: Değiştiyse commit'le
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/aykutcihan/tv-takip.git
          git add playlist.m3u films.m3u config/inat_config.json || true
          git diff --cached --quiet || (git commit -m "Stream URL güncellendi" && git pull --rebase -X ours origin main && git push)

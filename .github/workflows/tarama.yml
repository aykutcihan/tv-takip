name: Aylık Kanal Tarama

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıklar
        run: pip3 install -r requirements.txt

      - name: Playwright tarayıcı
        run: python3 -m playwright install chromium

      - name: TRT radyo URL güncelle
        run: python3 src/refresh_trt_radio.py

      - name: Karnaval radyo güncelle
        run: python3 src/refresh_karnaval.py

      - name: Radyo stream kontrol
        run: python3 src/check_radios.py

      - name: Değiştiyse commit'le
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/aykutcihan/tv-takip.git
          git add playlist.m3u || true
          git diff --cached --quiet || (git commit -m "Aylık tarama tamamlandı" && git pull --rebase -X ours origin main && git push)

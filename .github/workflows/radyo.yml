name: Radyo EPG

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radyo
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıklar
        run: pip3 install -r requirements.txt

      - name: Playwright tarayıcı
        run: python3 -m playwright install chromium

      - name: Radyo EPG güncelle
        run: python3 src/refresh_radio_epg.py

      - name: Karnaval şarkı bilgisi
        run: python3 src/karnaval_songs.py

      - name: Number1 şarkı bilgisi
        run: python3 src/number1_songs.py

      - name: Değiştiyse commit'le
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/aykutcihan/tv-takip.git
          git add radios.xml karnaval-songs.json number1-songs.json || true
          git diff --cached --quiet || (git commit -m "Radyo EPG güncellendi" && git pull --rebase -X ours origin main && git push)

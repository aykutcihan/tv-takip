name: EPG Güncelle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıklar
        run: pip3 install -r requirements.txt

      - name: Playwright tarayıcı
        run: python3 -m playwright install chromium

      - name: Token yenile
        run: python3 src/refresh_tokens.py

      - name: YouTube stream güncelle
        run: python3 src/refresh_youtube.py

      - name: EPG üret
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 src/main.py

      - name: Değiştiyse commit'le
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/aykutcihan/tv-takip.git
          git add epg.xml 2>/dev/null || true
          git add playlist.m3u 2>/dev/null || true
          git add cache/tmdb.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "EPG güncellendi" && git pull --rebase -X ours origin main && git push)
